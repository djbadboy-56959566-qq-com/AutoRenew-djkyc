# .github/workflows/stackryze-renew.yml —— 放到仓库的 .github/workflows/stackryze-renew.yml
# 注意：不要叫 renew.yml、脚本不要叫 renew.py，那两个名字已经被同仓库里
# DigitalPlat 的续签占了（DigitalPlat/renew.py + .github/workflows/renew.yml），
# 同名会互相覆盖；结果文件也改叫 stackryze_result.json 以示区分。
# 脚本放在仓库的 stackryze/ 文件夹里，工作流用 stackryze/stackryze_renew.py
# 这个路径跑；结果文件写在仓库根目录，通知步骤在根目录读它。
# StackRyze 域名自动续签，每周日北京时间 09:00 跑一次（UTC 01:00），
# 只续 60 天内到期的域名，其余跳过；也可随时 Actions → Run workflow 手动跑。
#
# 定时说明：GitHub Actions 的 cron 用 UTC，北京时间 = UTC+8，
# 每周日 09:00 北京时间 = 周日 UTC 01:00。定时任务不保证准点，
# 通常晚几分钟到几十分钟属于正常；只在仓库默认分支上跑。
#
# 仓库 Secrets（Settings → Secrets and variables → Actions → New repository secret），
# 千万不要把密码写进代码或聊天记录里，只放 Secrets：
#   STACKRYZE_EMAILS     - 3 个账号邮箱，逗号分隔，
#     例：56959566@qq.com,adjlevis@qq.com,djbadboy.vip@gmail.com
#   STACKRYZE_PASSWORD_1 / _2 / _3
#     - 与邮箱按序号一一对应的 Zitadel 登录密码（在 Zitadel 登录页输的那个）。
#     再加账号就按序号往下加 _4、_5……：仓库里加同名 Secret，
#     工作流 env 里已预留了 _4、_5 两行，STACKRYZE_EMAILS 后面逗号加邮箱就行。
#   STACKRYZE_TOTP_1 / _2 / _3（有 2FA 的账号必填，站里强制开了二步验证）
#     - 每个账号的验证器种子（TOTP secret），脚本用它现算 6 位验证码
#       自动填进二步验证页。种子只放 Secrets，绝不发聊天。
#     怎么拿到种子：在 Zitadel（auth.stackryze.com）账号设置里找到
#       二步验证/验证器，重新设置一次会显示新的二维码和种子；
#       当初设置时保存过二维码或种子文本的，直接用那个。
#     同样按序号往下加 _4、_5……，工作流 env 里已预留。
#     旧的 STACKRYZE_API_URL / STACKRYZE_COOKIE_1/2/3 不再用了，可以删掉。
#   TG_BOT_TOKEN / TG_CHAT_ID - Telegram 通知（跟 DigitalPlat 那个仓库同一套）。
#   WX_PUSH_URL / WX_PUSH_TOKEN - 微信通知，自建 wxsend 接口
#     （跟本仓库 DigitalPlat 那个工作流同一套名字，别用 WECHAT_API_URL，
#     这个仓库里没有那两个 Secret，用了就是空的）。
#
# 纯接口版（2026-11-20，取代浏览器版）：脚本只用 Python 标准库 urllib，
# 不装浏览器、不装任何 pip 包。浏览器版在 Actions 机房 IP 上走不通——
# 调试证明 CF 给机房 IP 的是无交互 "Performing security verification" 页，
# 0 个 iframe，没有勾选框可点，有头真 Chrome + Stealth 也过不去。
# 接口版绕开前端：盾只在 domain.stackryze.com 前面，登录站
# auth.stackryze.com 和接口站 api-domains.stackryze.com 都不走 CF；
# 脚本调 Zitadel 登录接口（/api/login + /api/mfa/verify）拿会话，
# 再调 /subdomains 列表和 /subdomains/{id}/renew 续期。
# 2026-11-20 本地 mock 端到端已通过（登录→2FA→续期→结果），
# 真站假账号已验证登录链（返回 invalid credentials，格式正确）。
#
# 通知规则（2026-11-20 起跟 DigitalPlat 那个工作流同一套模板，脚本只写 JSON，样式全在这里）：
#   - 一次运行只发一条消息；TG 用 HTML（<b> 加粗、<code> 域名、<a href> 链接），
#     微信用纯文本，一个 HTML 标签都没有，链接单独成行。
#   - 标题 🔔 + 👤 owner · 📁 仓库名 + 北京时间，汇总行 ✅ 续期 · ⚪ 跳过 · 🔴 失败 · 共 N 个域名 / N 个账号，
#     每个账号编号 + 完整邮箱，下面列出全部域名：✅ +1年 / ⚪ 剩 N 天 / 🔴 失败原因 / ⏰ 过期 N 天，
#     末尾 🔗 项目（仓库链接）+ 📋 运行记录（本次运行链接）。
name: StackRyze Renew

on:
  schedule:
    # 每周日北京时间 09:00
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查并续期域名
        env:
          STACKRYZE_EMAILS: ${{ secrets.STACKRYZE_EMAILS }}
          STACKRYZE_PASSWORD_1: ${{ secrets.STACKRYZE_PASSWORD_1 }}
          STACKRYZE_PASSWORD_2: ${{ secrets.STACKRYZE_PASSWORD_2 }}
          STACKRYZE_PASSWORD_3: ${{ secrets.STACKRYZE_PASSWORD_3 }}
          STACKRYZE_PASSWORD_4: ${{ secrets.STACKRYZE_PASSWORD_4 }}
          STACKRYZE_PASSWORD_5: ${{ secrets.STACKRYZE_PASSWORD_5 }}
          STACKRYZE_TOTP_1: ${{ secrets.STACKRYZE_TOTP_1 }}
          STACKRYZE_TOTP_2: ${{ secrets.STACKRYZE_TOTP_2 }}
          STACKRYZE_TOTP_3: ${{ secrets.STACKRYZE_TOTP_3 }}
          STACKRYZE_TOTP_4: ${{ secrets.STACKRYZE_TOTP_4 }}
          STACKRYZE_TOTP_5: ${{ secrets.STACKRYZE_TOTP_5 }}
        run: |
          python3 stackryze/stackryze_renew.py

      - name: Send notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WX_PUSH_URL: ${{ secrets.WX_PUSH_URL }}
          WX_PUSH_TOKEN: ${{ secrets.WX_PUSH_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          # 通知样式跟 DigitalPlat 那个工作流同一套模板（2026-11-20 用户指定）：
          # TG 用 HTML（<b> 加粗、<code> 域名、<a href> 链接），
          # 微信用纯文本，一个 HTML 标签都没有，链接单独成行。
          # 脚本只写 stackryze_result.json，样式全在这里。
          import html, json, os, urllib.request
          from datetime import datetime, timedelta, timezone

          RESULT_PATH = "stackryze_result.json"
          REPO_FULL = os.environ.get("REPO_FULL", "")
          REPO_URL = os.environ.get("REPO_URL", "")
          RUN_URL = os.environ.get("RUN_URL", "")
          ACTOR = os.environ.get("ACTOR", "")
          OWNER, _, REPO_NAME = REPO_FULL.partition("/")
          if not OWNER:
              OWNER = ACTOR
          if not REPO_NAME:
              REPO_NAME = REPO_FULL

          # 北京时间
          NOW = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          try:
              with open(RESULT_PATH, encoding="utf-8") as f:
                  result = json.load(f)
          except Exception as e:
              result = {"status": "error", "summary": {},
                        "accounts": [], "error": f"读不到 {RESULT_PATH}：{e}"}

          summary = result.get("summary") or {}
          accounts = result.get("accounts") or []
          status = result.get("status") or "error"
          top_error = (result.get("error") or "").strip()

          def clean(text, limit=80):
              """压成一行、截断，供两份消息共用。"""
              if text is None:
                  return ""
              text = str(text).replace("\n", " ").replace("\r", " ").strip()
              return text[:limit] + ("…" if len(text) > limit else "")

          def domain_line(d):
              """返回 (图标, 域名, 后缀说明)，TG / 微信共用。"""
              res = d.get("result")
              icon = {"renewed": "✅", "skipped": "⚪", "failed": "🔴", "expired": "⏰"}.get(res, "❓")
              name = d.get("name") or ""
              days = d.get("remaining_days")
              if res == "renewed":
                  suffix = "+1年"
              elif res == "skipped":
                  suffix = f"剩 {days} 天" if days is not None else clean(d.get("detail"), 40)
              elif res == "failed":
                  suffix = clean(d.get("detail"), 60) or "失败"
              elif res == "expired":
                  suffix = f"过期 {abs(days)} 天" if isinstance(days, int) else clean(d.get("detail"), 40)
              else:
                  suffix = clean(d.get("detail"), 40)
              return icon, name, suffix

          ERROR_STATUSES = ("cf_challenge", "login_failed", "needs_second_factor",
                            "no_password_login", "no_password", "api_error", "error")

          def summary_line():
              line = (
                  f"✅ 续期 {summary.get('renewed', 0)} · "
                  f"⚪ 跳过 {summary.get('skipped', 0)} · "
                  f"🔴 失败 {summary.get('failed', 0)}"
              )
              if summary.get("expired"):
                  line += f" · ⏰ 过期 {summary.get('expired')}"
              line += f" · 共 {summary.get('domains', 0)} 个域名 / {summary.get('accounts', 0)} 个账号"
              return line

          # ---- TG 版：HTML ----
          tg_lines = [
              "<b>🔔 StackRyze 域名续签</b>",
              f"👤 {html.escape(OWNER)} · 📁 {html.escape(REPO_NAME)}",
              f"🕐 {NOW}",
              "",
          ]
          if status == "error" and top_error:
              tg_lines.append(f"🔴 脚本运行失败：{html.escape(clean(top_error))}")
          tg_lines.append(summary_line())
          for a in accounts:
              tg_lines.append("")
              tg_lines.append(f"<b>{a.get('index', '')}. {html.escape(a.get('email') or '')}</b>")
              if a.get("status") in ERROR_STATUSES:
                  tg_lines.append(f"  🔴 {html.escape(clean(a.get('error'), 100))}")
              elif not a.get("domains"):
                  tg_lines.append("  — 无域名")
              else:
                  for d in a["domains"]:
                      icon, name, suffix = domain_line(d)
                      tg_lines.append(f"  {icon} <code>{html.escape(name)}</code> {html.escape(suffix)}")
          tg_lines += [
              "",
              f"🔗 项目：<a href=\"{html.escape(REPO_URL, quote=True)}\">{html.escape(REPO_NAME)}</a>",
              f"📋 运行记录：<a href=\"{html.escape(RUN_URL, quote=True)}\">查看本次运行</a>",
          ]
          tg_text = "\n".join(tg_lines)

          # ---- 微信版：纯文本，一个 HTML 标签都没有 ----
          wx_lines = [
              "🔔 StackRyze 域名续签",
              f"👤 {OWNER} · 📁 {REPO_NAME}",
              f"🕐 {NOW}",
              "",
          ]
          if status == "error" and top_error:
              wx_lines.append(f"🔴 脚本运行失败：{clean(top_error)}")
          wx_lines.append(summary_line())
          for a in accounts:
              wx_lines.append("")
              wx_lines.append(f"{a.get('index', '')}. {a.get('email') or ''}")
              if a.get("status") in ERROR_STATUSES:
                  wx_lines.append(f"  🔴 {clean(a.get('error'), 100)}")
              elif not a.get("domains"):
                  wx_lines.append("  — 无域名")
              else:
                  for d in a["domains"]:
                      icon, name, suffix = domain_line(d)
                      wx_lines.append(f"  {icon} {name} {suffix}")
          wx_lines += [
              "",
              "🔗 项目：",
              REPO_URL,
              "📋 运行记录：",
              RUN_URL,
          ]
          wx_text = "\n".join(wx_lines)
          wx_title = "StackRyze 域名续签"

          def post_json(url, payload, headers=None):
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"),
                                           headers={"Content-Type": "application/json", **(headers or {})},
                                           method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.read().decode("utf-8", "replace")[:300]

          tg_token = os.environ.get("TG_BOT_TOKEN", "")
          tg_chat = os.environ.get("TG_CHAT_ID", "")
          if tg_token and tg_chat:
              try:
                  print("TG:", post_json(f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      {"chat_id": tg_chat, "text": tg_text, "parse_mode": "HTML",
                       "disable_web_page_preview": True}))
              except Exception as e:
                  print(f"TG 发送失败：{e}")
          else:
              print("TG 未配置，跳过。")

          wx_url = os.environ.get("WX_PUSH_URL", "")
          wx_token = os.environ.get("WX_PUSH_TOKEN", "")
          if wx_url and wx_token:
              try:
                  print("WX:", post_json(wx_url,
                      {"token": wx_token, "title": wx_title,
                       "content": wx_text},
                      headers={"Authorization": f"Bearer {wx_token}"}))
              except Exception as e:
                  # 403 时把响应体打出来：wxsend 对错 token 只回
                  # {"msg":"Invalid token"}，只看状态码分不清是 token
                  # 错还是被 CF 拦了。
                  body = ""
                  try:
                      body = e.read().decode("utf-8", "replace")[:300]
                  except Exception:
                      pass
                  print(f"微信发送失败：{e} 响应：{body}")
          else:
              print("微信未配置，跳过。")
          PY
      - name: 把本次结果写到 Actions 摘要里
        if: always()
        run: |
          if [ -f stackryze_result.json ]; then cat stackryze_result.json >> "$GITHUB_STEP_SUMMARY"; fi
