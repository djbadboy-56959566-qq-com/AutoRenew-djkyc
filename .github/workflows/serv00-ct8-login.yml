name: Serv00 & CT8 Auto Login

on:
  schedule:
    # 每月 1 号 00:00 UTC = 北京时间 08:00，90 天保活，每月一次就够了
    - cron: '0 0 1 * *'
  workflow_dispatch: # 支持手动触发

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 登录脚本本身是纯标准库，不用装依赖。
      # 但通知这一步改用 requests，跟 DigitalPlat 续期那个
      # 能正常收到微信的工作流用同一个库、同一套发法，
      # 不再用 urllib——urllib 默认的 Python-urllib User-Agent
      # 在 Cloudflare 前面容易被拦，requests 不会。
      - name: Install requests
        run: pip install requests

      - name: Run Login Script
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: python3 DigitalPlat/serv00-ct8/login.py

      # ============================================================
      # 消息样式都在这一步里，不在脚本里。
      # 脚本只把结果写到 DigitalPlat/serv00-ct8/login_result.json，
      # 这里读结果，拼 TG + 微信两份消息再发。
      # TG 用 HTML，微信用纯文本，地址单独放一行。
      # 微信发法跟 DigitalPlat 续期一模一样：
      # requests.post，body 带 token，头是 Bearer + token。
      # ============================================================
      - name: Send Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WX_PUSH_URL: ${{ secrets.WX_PUSH_URL }}
          WX_PUSH_TOKEN: ${{ secrets.WX_PUSH_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os
          import requests

          try:
              with open("DigitalPlat/serv00-ct8/login_result.json", encoding="utf-8") as f:
                  results = json.load(f)
          except Exception:
              results = [{"provider": "?", "username": "?", "panel": "",
                          "ok": False, "message": "脚本没有产出结果文件，请看 Actions 日志"}]

          repo = os.getenv("GITHUB_REPOSITORY", "你的用户名/你的仓库名")
          owner, _, name = repo.partition("/")
          repo_url = f"https://github.com/{repo}/"
          ok = sum(1 for r in results if r.get("ok"))
          result_lines = []
          for r in results:
              icon = "✅" if r.get("ok") else "❌"
              result_lines.append(f"{icon} {r.get('provider')} {r.get('username')}：{r.get('message')}")
          summary = f"完成：{ok}/{len(results)} 个账号登录成功"

          # ---- TG 版：HTML ----
          tg_text = "\n".join([
              f"👤 {owner} · 📁 {name}",
              '🌐 Serv00 平台：<a href="https://www.serv00.com/">请点击</a>',
              '🌐 CT8 平台：<a href="https://www.ct8.pl/">请点击</a>',
              f'🔗 仓库：<a href="{repo_url}">请点击</a>',
              *result_lines,
              summary,
          ])

          # ---- 微信版：纯文本，一个 HTML 标签都没有 ----
          wx_text = "\n".join([
              "Serv00 & CT8 自动登录保号",
              f"👤 {owner} · 📁 {name}",
              "🌐 Serv00 平台：",
              "https://www.serv00.com/",
              "🌐 CT8 平台：",
              "https://www.ct8.pl/",
              "🔗 仓库：",
              repo_url,
              *result_lines,
              summary,
          ])

          # ---- 发送 TG ----
          tg_token = os.getenv("TG_BOT_TOKEN")
          tg_chat = os.getenv("TG_CHAT_ID")
          if tg_token and tg_chat:
              try:
                  res = requests.post(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      json={"chat_id": tg_chat, "text": tg_text, "parse_mode": "HTML",
                            "disable_web_page_preview": True},
                      timeout=15,
                  )
                  print(f"Telegram: {res.status_code} {res.text[:300]}")
              except Exception as e:
                  print(f"Telegram 通知异常: {e}")
          else:
              print("Telegram 未配置，跳过。")

          # ---- 发送微信 ----
          wx_url = os.getenv("WX_PUSH_URL")
          wx_token = os.getenv("WX_PUSH_TOKEN")
          if wx_url and wx_token:
              try:
                  res = requests.post(
                      wx_url,
                      json={"token": wx_token, "title": "Serv00 & CT8 自动登录保号", "content": wx_text},
                      headers={"Authorization": f"Bearer {wx_token}",
                               "Content-Type": "application/json"},
                      timeout=15,
                  )
                  print(f"微信: {res.status_code} {res.text[:300]}")
              except Exception as e:
                  print(f"微信通知异常: {e}")
          else:
              print("微信未配置，跳过。")
          PY
