name: DigitalPlat Auto Renew
on:
  schedule:
    - cron: '15 1 15 * *'  # 每月15日 北京时间9:15 (UTC 1:15) 运行一次
  workflow_dispatch:  # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      # 只做续期：renew.py 不发通知、不带任何消息样式，
      # 只把结构化结果写到 renew_result.json。
      # 通知文案全部在下面 "Send notification" 这一步里。
      - name: Run renewal script
        env:
          DP_API_KEY: ${{ secrets.DP_API_KEY }}
          DP_ACCOUNT_EMAILS: ${{ secrets.DP_ACCOUNT_EMAILS }}
        run: |
          python DigitalPlat/renew.py

      # ============================================================
      # 通知模板（TG + 微信）都在这里，改推送样式只改这一段，
      # 不用动 renew.py。
      #
      # 规则：
      #   - TG 用 HTML：<b> 加粗、<code> 域名、<a href> 可点链接
      #   - 微信用纯文本：微信模板消息不认 HTML 标签，
      #     加 <b> / <code> 会原样显示出来，所以微信版一个标签都没有，
      #     项目地址单独放一行，点开 / 复制都方便
      #   - 两份消息共用同一份 renew_result.json，只是渲染方式不同
      #   - 用户 / 项目 / 地址都从 GitHub 上下文自动取，
      #     不用在脚本里写死：用户 = 仓库 owner，项目 = 仓库名
      # ============================================================
      - name: Send notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WX_PUSH_URL: ${{ secrets.WX_PUSH_URL }}
          WX_PUSH_TOKEN: ${{ secrets.WX_PUSH_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          python - << 'PY'
          import html
          import json
          import os
          from datetime import datetime, timedelta, timezone

          import requests

          RESULT_PATH = "renew_result.json"
          REPO_FULL = os.environ.get("REPO_FULL", "")
          REPO_URL = os.environ.get("REPO_URL", "")
          RUN_URL = os.environ.get("RUN_URL", "")
          ACTOR = os.environ.get("ACTOR", "")
          OWNER, _, REPO_NAME = REPO_FULL.partition("/")
          if not OWNER:
              OWNER = ACTOR
          if not REPO_NAME:
              REPO_NAME = REPO_FULL

          # 北京时间
          NOW = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")

          # ---- 读脚本的结构化结果；文件缺失也照常发一条报错通知 ----
          try:
              with open(RESULT_PATH, encoding="utf-8") as f:
                  result = json.load(f)
          except Exception as e:
              result = {
                  "status": "error",
                  "summary": {"accounts": 0, "domains": 0, "renewed": 0, "skipped": 0, "failed": 0},
                  "accounts": [],
                  "error": f"未生成 {RESULT_PATH}，续期步骤可能未运行或提前失败：{e}",
              }

          summary = result.get("summary") or {}
          accounts = result.get("accounts") or []
          status = result.get("status") or "error"
          top_error = (result.get("error") or "").strip()

          def clean(text, limit=80):
              """压成一行、截断，供两份消息共用。"""
              if text is None:
                  return ""
              text = str(text).replace("\n", " ").replace("\r", " ").strip()
              return text[:limit] + ("…" if len(text) > limit else "")

          def domain_line(d):
              """返回 (图标, 域名, 后缀说明)，TG / 微信共用。"""
              icon = {"renewed": "✅", "skipped": "⚪", "failed": "🔴"}.get(d.get("result"), "❓")
              name = d.get("name") or ""
              days = d.get("remaining_days")
              if d.get("result") == "renewed":
                  suffix = "+1年"
              elif d.get("result") == "skipped":
                  suffix = f"剩 {days} 天" if days is not None else clean(d.get("detail"), 40)
              elif d.get("result") == "failed":
                  suffix = clean(d.get("detail"), 60) or "失败"
              else:
                  suffix = clean(d.get("detail"), 40)
              return icon, name, suffix

          # ---- TG 版：HTML ----
          tg_lines = [
              "<b>🔔 DigitalPlat 域名自动续期</b>",
              f"👤 {html.escape(OWNER)} · 📁 {html.escape(REPO_NAME)}",
              f"🕐 {NOW}",
              "",
          ]
          if status == "error" and top_error:
              tg_lines.append(f"🔴 脚本运行失败：{html.escape(clean(top_error))}")
          tg_lines.append(
              f"🟢续期 {summary.get('renewed', 0)} · "
              f"⚪ 跳过 {summary.get('skipped', 0)} · "
              f"🔴 失败 {summary.get('failed', 0)} · "
              f"共 {summary.get('domains', 0)} 个域名 / {summary.get('accounts', 0)} 个账号"
          )
          for a in accounts:
              tg_lines.append("")
              tg_lines.append(f"<b>{a.get('index', '')}. {html.escape(a.get('email') or '')}</b>")
              if a.get("status") in ("no_key", "error"):
                  tg_lines.append(f"  🔴 {html.escape(clean(a.get('error'), 100))}")
              elif not a.get("domains"):
                  tg_lines.append("  — 无域名")
              else:
                  for d in a["domains"]:
                      icon, name, suffix = domain_line(d)
                      tg_lines.append(f"  {icon} <code>{html.escape(name)}</code> {html.escape(suffix)}")
          tg_lines += [
              "",
              f"🔗 项目：<a href=\"{html.escape(REPO_URL, quote=True)}\">{html.escape(REPO_NAME)}</a>",
              f"📋 运行记录：<a href=\"{html.escape(RUN_URL, quote=True)}\">查看本次运行</a>",
          ]
          tg_text = "\n".join(tg_lines)

          # ---- 微信版：纯文本，一个 HTML 标签都没有 ----
          wx_lines = [
              "🔔 DigitalPlat 域名续期",
              f"👤 {OWNER} · 📁 {REPO_NAME}",
              f"🕐 {NOW}",
              "",
          ]
          if status == "error" and top_error:
              wx_lines.append(f"🔴 脚本运行失败：{clean(top_error)}")
          wx_lines.append(
              f"🟢 续期 {summary.get('renewed', 0)} · "
              f"⚪ 跳过 {summary.get('skipped', 0)} · "
              f"🔴 失败 {summary.get('failed', 0)} · "
              f"共 {summary.get('domains', 0)} 个域名 / {summary.get('accounts', 0)} 个账号"
          )
          for a in accounts:
              wx_lines.append("")
              wx_lines.append(f"{a.get('index', '')}. {a.get('email') or ''}")
              if a.get("status") in ("no_key", "error"):
                  wx_lines.append(f"  🔴 {clean(a.get('error'), 100)}")
              elif not a.get("domains"):
                  wx_lines.append("  — 无域名")
              else:
                  for d in a["domains"]:
                      icon, name, suffix = domain_line(d)
                      wx_lines.append(f"  {icon} {name} {suffix}")
          wx_lines += [
              "",
              "🔗 项目：",
              REPO_URL,
              "📋 运行记录：",
              RUN_URL,
          ]
          wx_text = "\n".join(wx_lines)
          wx_title = "DigitalPlat 域名续期"

          # ---- 发送 TG（HTML）----
          tg_token = os.environ.get("TG_BOT_TOKEN")
          tg_chat = os.environ.get("TG_CHAT_ID")
          if tg_token and tg_chat:
              try:
                  res = requests.post(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      json={"chat_id": tg_chat, "text": tg_text,
                            "parse_mode": "HTML", "disable_web_page_preview": True},
                      timeout=10,
                  )
                  print(f"Telegram: {res.status_code} {res.text[:300]}")
              except Exception as e:
                  print(f"Telegram 通知异常: {e}")
          else:
              print("Telegram 未配置，跳过。")

          # ---- 发送微信（纯文本；payload 格式保持和原来一致）----
          wx_url = os.environ.get("WX_PUSH_URL")
          wx_token = os.environ.get("WX_PUSH_TOKEN")
          if wx_url and wx_token:
              try:
                  res = requests.post(
                      wx_url,
                      json={"token": wx_token, "title": wx_title, "content": wx_text},
                      headers={"Authorization": f"Bearer {wx_token}",
                               "Content-Type": "application/json"},
                      timeout=10,
                  )
                  print(f"微信: {res.status_code} {res.text[:300]}")
              except Exception as e:
                  print(f"微信通知异常: {e}")
          else:
              print("微信未配置，跳过。")
          PY
